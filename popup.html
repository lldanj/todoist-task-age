<!DOCTYPE html>
<html>
<head>
  <title>Todoist Creation Date Viewer</title>
  <style>
    body {
      font-family: sans-serif;
      min-width: 220px;
      padding: 12px;
      margin: 0;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .settings-link {
      display: block;
      padding: 8px;
      background: #f0f0f0;
      border-radius: 4px;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      color: #333;
      font-size: 13px;
      border: 1px solid #ddd;
    }
    .settings-link:hover {
      background: #e0e0e0;
    }
    .divider {
      border-top: 1px solid #ddd;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <label>
    <input type="checkbox" id="toggle">
    Enable extension
  </label>

  <div class="divider"></div>

  <a href="#" class="settings-link" id="settingsLink">⚙️ Configure API Token</a>

  <script src="popup.js"></script>
</body>
</html>
